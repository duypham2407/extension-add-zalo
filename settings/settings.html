<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Cài đặt — Zalo Auto Add Friend</title>
  <link rel="stylesheet" href="settings.css" />
</head>
<body>
  <div class="container">
    <header>
      <span class="logo">🤝</span>
      <h1>Cài đặt Extension</h1>
    </header>

    <div class="section">
      <label class="section-title">✉️ Lời chào mặc định</label>
      <p class="hint">Nội dung sẽ được điền vào ô tin nhắn khi gửi lời mời kết bạn. Tối đa 150 ký tự.</p>
      <textarea id="greeting" maxlength="150" placeholder="Xin chào, mình là..."></textarea>
      <div class="char-count"><span id="char-count">0</span>/150</div>
    </div>

    <div class="section">
      <label class="section-title">⏱️ Cấu hình Delay</label>
      <div class="row">
        <div class="field">
          <label>Delay tối thiểu (giây)</label>
          <input type="number" id="delay-min" min="1" max="30" value="3" />
        </div>
        <div class="field">
          <label>Delay tối đa (giây)</label>
          <input type="number" id="delay-max" min="1" max="60" value="8" />
        </div>
      </div>
      <div class="row">
        <div class="field">
          <label>Nghỉ dài sau N lần</label>
          <input type="number" id="batch-size" min="5" max="100" value="10" />
        </div>
        <div class="field">
          <label>Thời gian nghỉ dài (giây)</label>
          <input type="number" id="batch-rest" min="30" max="600" value="90" />
        </div>
      </div>
    </div>

    <div class="section">
      <label class="section-title">🖥️ Backend Server</label>
      <div class="field">
        <label>URL Backend</label>
        <input type="url" id="backend-url" placeholder="http://localhost:3000" />
      </div>
      <div class="field">
        <label>API Key</label>
        <input type="text" id="api-key" placeholder="your-secret-api-key" />
      </div>
      <button class="btn-secondary" id="test-btn">🔗 Test kết nối</button>
      <span id="test-result"></span>
    </div>

    <div class="section">
      <div class="section-header">
        <label class="section-title">💬 Tự động nhắn tin</label>
        <label class="toggle-switch">
          <input type="checkbox" id="auto-msg-enabled" />
          <span class="toggle-track"><span class="toggle-thumb"></span></span>
        </label>
      </div>
      <p class="hint">Sau khi gửi lời mời kết bạn thành công, tự động nhắn theo thứ tự: ảnh (nếu có) → các tin nhắn.</p>

      <!-- Image Upload -->
      <div class="img-upload-section">
        <label class="img-upload-label" id="img-upload-label" for="img-file-input">
          <span class="img-upload-icon">🖼️</span>
          <span id="img-upload-text">Chọn ảnh gửi kèm (tùy chọn)</span>
          <input type="file" id="img-file-input" accept="image/*" hidden />
        </label>
        <div id="img-preview-wrap" style="display:none">
          <img id="img-preview" src="" alt="preview" />
          <button class="btn-remove-img" id="btn-remove-img" title="Xóa ảnh">✕</button>
        </div>
      </div>

      <div id="msg-list"></div>

      <button class="btn-add-msg" id="btn-add-msg">＋ Thêm tin nhắn</button>
    </div>

    <div class="footer">
      <button class="btn-primary" id="save-btn">💾 Lưu cài đặt</button>
      <span id="save-msg"></span>
    </div>
  </div>
  <script src="settings.js"></script>
</body>
</html>
