<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Zalo Auto Add Friend</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="app">
    <header>
      <span class="logo">🤝</span>
      <span class="title">Zalo Auto Add Friend</span>
      <button class="settings-btn" id="open-settings" title="Cài đặt">⚙️</button>
    </header>

    <!-- Hard Stop Banner (Phase 2) -->
    <div class="hard-stop-banner" id="hard-stop-banner" style="display:none">
      <div class="hard-stop-icon">🛑</div>
      <div class="hard-stop-body">
        <div class="hard-stop-title">Đã dừng khẩn cấp</div>
        <div class="hard-stop-reason" id="hard-stop-reason"></div>
      </div>
      <button class="hard-stop-dismiss" id="hard-stop-dismiss" title="Đóng">✕</button>
    </div>

    <!-- Confirm Panel (Phase 3 — Assisted Mode) -->
    <div class="confirm-panel" id="confirm-panel" style="display:none">
      <div class="confirm-header">
        <span class="confirm-icon">👤</span>
        <span class="confirm-title">Xác nhận kết bạn</span>
      </div>
      <div class="confirm-body">
        <div class="confirm-info">
          <span class="confirm-label">SĐT:</span>
          <span class="confirm-value" id="confirm-phone"></span>
        </div>
        <div class="confirm-info">
          <span class="confirm-label">Tên Zalo:</span>
          <span class="confirm-value" id="confirm-name"></span>
        </div>
        <div class="confirm-warning" id="confirm-warning" style="display:none">
          ⚠️ <span id="confirm-warning-text"></span>
        </div>
      </div>
      <div class="confirm-actions">
        <button class="btn-confirm" id="btn-confirm">✅ Kết bạn</button>
        <button class="btn-skip" id="btn-skip">⏭️ Bỏ qua</button>
      </div>
    </div>

    <!-- Session Stats Bar (Phase 4) -->
    <div class="session-stats" id="session-stats" style="display:none">
      <span class="ss-item">📊 <span id="ss-actions">0</span>/<span id="ss-cap">30</span></span>
      <span class="ss-sep">·</span>
      <span class="ss-item ss-errors">💥 <span id="ss-errors">0</span> lỗi liên tiếp</span>
    </div>

    <!-- Upload Section -->
    <div class="section" id="upload-section">
      <label class="upload-area" for="file-input" id="upload-label">
        <span class="upload-icon">📂</span>
        <span id="upload-text">Chọn file Excel (.xlsx)</span>
      </label>
      <input type="file" id="file-input" accept=".xlsx,.xls" hidden />
    </div>

    <!-- Stats bar -->
    <div class="stats-bar" id="stats-bar" style="display:none">
      <span class="stat"><span id="count-total">0</span> SĐT</span>
      <span class="sep">·</span>
      <span class="stat valid"><span id="count-valid">0</span> hợp lệ</span>
      <span class="sep">·</span>
      <span class="stat skip"><span id="count-empty">0</span> trống</span>
    </div>

    <!-- Phone List -->
    <div class="phone-list" id="phone-list" style="display:none">
      <div class="list-header">
        <span>Danh sách SĐT</span>
        <span class="progress-label" id="progress-label"></span>
      </div>
      <div class="list-body" id="list-body"></div>
    </div>

    <!-- Progress -->
    <div class="progress-wrap" id="progress-wrap" style="display:none">
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill" style="width:0%"></div>
      </div>
      <span class="progress-text" id="progress-text">0 / 0</span>
    </div>

    <!-- Results -->
    <div class="result-row" id="result-row" style="display:none">
      <span class="r success">✅ <span id="r-success">0</span></span>
      <span class="r not-found">❌ <span id="r-not-found">0</span></span>
      <span class="r already">ℹ️ <span id="r-already">0</span></span>
      <span class="r error">💥 <span id="r-error">0</span></span>
    </div>

    <!-- Controls -->
    <div class="controls" id="controls" style="display:none">
      <button class="btn-start" id="btn-start">▶ Bắt đầu</button>
      <button class="btn-pause" id="btn-pause" style="display:none">⏸ Tạm dừng</button>
      <button class="btn-resume" id="btn-resume" style="display:none">▶ Tiếp tục</button>
      <button class="btn-stop" id="btn-stop" style="display:none">⏹ Dừng</button>
      <button class="btn-reset" id="btn-reset">🔄 Reset</button>
    </div>

    <!-- Status message -->
    <div class="status-msg" id="status-msg"></div>

    <!-- Log & Export Bar (Phase 4) -->
    <div class="log-bar" id="log-bar">
      <button class="btn-log" id="btn-show-log">📋 Nhật ký</button>
      <button class="btn-export" id="btn-export-csv">📥 Xuất CSV</button>
    </div>

    <!-- Log Viewer Panel (Phase 4) -->
    <div class="log-panel" id="log-panel" style="display:none">
      <div class="log-panel-header">
        <span>📋 Nhật ký hoạt động</span>
        <button class="log-panel-close" id="log-panel-close">✕</button>
      </div>
      <div class="log-panel-body" id="log-panel-body">
        <div class="log-empty">Chưa có dữ liệu</div>
      </div>
    </div>
  </div>

  <script src="../lib/xlsx.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
